name: Build BiliPai (Anti-Fraud Edition)

on:
  push:
    branches: [ feature/bili-send-check, main ]
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: '选择编译类型'
        required: true
        default: 'dev'
        options:
          - 'dev'
          - 'release'

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: ⬇️ 检出源码
        uses: actions/checkout@v4

      - name: ☕ 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ⚡ 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 📱 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 🛡️ 自动配置 google-services.json (含 dev 与 release 包名)
        run: |
          mkdir -p ./app
          if [ -n "${{ secrets.FCM }}" ]; then
            echo "${{ secrets.FCM }}" | base64 -d > ./app/google-services.json
            echo "使用自定义 FCM 证书"
          else
            cat << 'EOF' > ./app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "pure-bilibili-dummy",
              "storage_bucket": "pure-bilibili.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.android.purebilibili"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123457",
                  "android_client_info": {
                    "package_name": "com.android.purebilibili.dev"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "已成功生成多包名占位 google-services.json"
          fi

      - name: 🚀 编译开发版 APK (assembleDev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :app:assembleDev --no-daemon --stacktrace

      - name: 📦 上传构建产物 (APK)
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-AntiFraud-Dev-APK
          path: app/build/outputs/bilipai/dev/*.apk
          retention-days: 7
